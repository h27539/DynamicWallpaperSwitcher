name: Compatibility report
description: Share a tested macOS and source-video combination
title: "[Compatibility] "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: "Please do not upload Apple proprietary wallpaper assets, personal videos, home paths, or full private system logs."
  - type: input
    id: macos
    attributes: {label: macOS version}
    validations: {required: true}
  - type: dropdown
    id: architecture
    attributes: {label: Architecture, options: [Intel, Apple Silicon]}
    validations: {required: true}
  - type: input
    id: model
    attributes: {label: Mac model}
    validations: {required: true}
  - type: input
    id: ffmpeg
    attributes: {label: FFmpeg / ffprobe version}
  - type: input
    id: x265
    attributes: {label: x265 version}
  - type: textarea
    id: source
    attributes: {label: "Source resolution, fps, codec, HDR/SDR, and duration"}
    validations: {required: true}
  - type: textarea
    id: conversion
    attributes: {label: Conversion and compatibility-check result}
  - type: textarea
    id: lock
    attributes: {label: Lock-screen playback result}
    validations: {required: true}
  - type: textarea
    id: unlock
    attributes: {label: Post-unlock desktop result}
    validations: {required: true}
